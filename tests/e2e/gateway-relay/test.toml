nodes   = ["node1", "node2", "reflector"]
timeout = 1500
after   = "adopt-node"
# why: enter-nat rewrites the world in place and nothing puts it back, and
# the gateway config outlives the test on two VMs.
destroys = true
ops     = ["enter-nat node2",
           "configure-gateway node2 --gateway reflector --peer node1"]
facts   = ["endpoint", "gateway_identity", "linked", "networks_to_target",
           "registered", "target_identity"]
