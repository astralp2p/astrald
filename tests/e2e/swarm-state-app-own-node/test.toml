nodes    = ["node1", "node3"]
after    = "swarm-state-member"
timeout  = 240
host_listener = "serves the wallet stand-in on a test-host port that node3 dials"
# why destroys: it adds apps and their requests to the swarm, which a later test in the world would see
destroys = true
facts    = ["app_own_node"]
answers  = "it answers SwarmState requests itself: the User's answer is what it tests"
