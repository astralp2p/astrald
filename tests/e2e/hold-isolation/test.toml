nodes    = ["node1"]
timeout  = 120
after    = "bootstrap-user-software-key"
destroys = true
facts    = ["ids", "apps", "lists", "purged"]

# why: objects.purge never takes an object touched within purge_floor, one
# hour by default, and this test purges objects it has just written
[config.node1.objects]
purge_floor = "0s"
