nodes      = ["node1", "node2"]
timeout    = 300
after      = "adopt-node"
restart    = ["node2"]
restart_kill = "node2 must send no services.removed of its own as it goes, so node1's follow removes the provider's offering because node1 lost its carry to node2 (member_lost)"
destroys   = true
host_listener = "keeps a provider app on the test host, whose handler node2 dials, across a restart of node2"
facts      = ["services_node_restart"]
