nodes    = ["node1", "node2"]
after    = "adopt-node"
# why: the world is left whole, but test_plan.py requires every test in a
# world after w0 to destroy
destroys = true
timeout  = 180
facts    = ["idle_keepalive"]

# why short timing: the keepalive runs many intervals within the test's
# budget; link-dead-peer-keepalive shares this world and reads the same keys.
# why log_pings: a pong logs "ping with <peer>", the only trace of a probe.
[config.node1.tcp]
link_idle_ping    = "2s"
link_ping_timeout = "2s"

[config.node1.kcp]
link_idle_ping    = "2s"
link_ping_timeout = "2s"

[config.node1.nodes]
log_pings = true

[config.node2.tcp]
link_idle_ping    = "2s"
link_ping_timeout = "2s"

[config.node2.kcp]
link_idle_ping    = "2s"
link_ping_timeout = "2s"

[config.node2.nodes]
log_pings = true
