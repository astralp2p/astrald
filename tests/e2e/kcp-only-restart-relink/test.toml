nodes    = ["node1", "node2"]
after    = "adopt-node"
restart  = ["node2"]
restart_kill = "node2 must send node1 nothing as it goes, so node1 finds the kcp link to node2's old process dead on its own"
# why: tcp dial and listen stay off in both nodes' trees, and every restarting
# test destroys its world
destroys = true
timeout  = 240
facts    = ["kcp_restart_relink"]
