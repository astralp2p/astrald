nodes   = ["node1", "node2"]
timeout = 900
after   = "adopt-node"
# why: entering a NAT netns rewrites the world in place and nothing puts it
# back, so a sibling cannot continue adopt-node's world afterwards.
destroys = true
ops     = ["enable-tor node1 node2",
           "enter-nat node1 node2",
           # the session is an ssh -L forward and ssh lands in the root netns;
           # enter-nat just moved apphost out of it. This is the door back in.
           "expose-apphost node1 node2",
           "configure-nat-tor node1 node2",
           "add-reflector node1 node2 --reflector reflector"]
facts   = ["nat_link_networks"]
