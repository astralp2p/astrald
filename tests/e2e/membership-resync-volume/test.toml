nodes      = ["node1", "node2", "node3", "node4", "node5", "node6", "node7", "node8", "node9", "node10"]
timeout    = 300
after      = "adopt-node"
destroys   = true
facts      = ["bans", "link_events", "sweep"]

# why: the sweep runs once an hour by default; a short period lets several
# sweeps fall inside the test
[config.node1.user]
reconcile_interval = "10s"
