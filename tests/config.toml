# Each run leases one span of ports, so concurrent runs never share a port.
# Node N of a run uses the span's first port + 10N: +0 apphost, +1 tcp,
# +2 ether, +3 kcp, +4 mcp, +5 the external authority a driver may serve.
[ports]
base = 20800            # the first span's first port
span = 100              # ports per span: 10 nodes per run
spans = 20              # spans from base: 20 concurrent runs per host

[astral_py]
path = "~/work/astralp2p/astral-py/master"

[build]
package = "./cmd/astrald"

[agent]
# Which operator profile drives --driver agent.
use = "qwen"

# An operator profile is everything the harness needs to know about one agent:
# where it lives, and how to hand it a prompt. `command` gets {prompt} replaced
# with the path to the prompt file inside the guest.
#
# why a profile rather than constants: the harness's contract with an agent is
# small — reach it, hand it a prompt, read JSON facts out of its home — and
# everything else was incidental hardcoding. Naming it is what makes a second
# agent a config entry instead of a patch.
#
# note: a profile says how to INVOKE an agent, never how to install one. The
# named command has to already exist in the world (baked into the lab, or put
# there by a vmop).
[agent.qwen]
vm       = "node1"
user     = "tester"
command  = 'qwen -y "$(cat {prompt})"'
model    = "muse-glimmer-30b-p6"
base_url = ""
