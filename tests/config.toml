# Each run leases one span of ports, so concurrent runs never share a port.
# Node N of a world uses the span's first port + 10N: +0 apphost, +1 tcp,
# +2 ether, +3 kcp, +4 mcp, +5 the external authority a driver may serve.
# Every world of a run starts again at node 0 on the run's span.
[ports]
base = 20800            # the first span's first port
span = 200              # ports per span: 20 nodes per world
spans = 20              # spans from base: 20 concurrent runs, 20800-24799

[astral_py]
path = "~/work/astralp2p/astral-py/master"
# The oldest astral-py commit these tests run against. 57460ab decodes
# user.info's State and Manager, which the setup drivers read; a checkout
# without it is refused before the first query.
requires = "57460ab4ec928e72229c0941629606ad13dd4e2d"

[build]
package = "./cmd/astrald"

[agent]
# The model the lab's operator (Qwen Code on node1, lib/agent.py) drives
# --driver agent with, set in the operator once per VM world. An empty model
# keeps the one the lab baked. base_url applies only with a model, and empty
# keeps the lab's endpoint.
model    = "deepseek-v4-flash"
base_url = ""
